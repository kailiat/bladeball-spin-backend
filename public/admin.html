<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>BladeBall Admin</title>

<style>

body{

background:#111118;
color:white;
font-family:Arial;
padding:30px;

}

h1{

color:#8b3dff;

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

th{

background:#8b3dff;
padding:15px;

}

td{

background:#1d1d26;
padding:12px;
border-bottom:1px solid #333;
text-align:center;

}

button{

padding:8px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;

}

.approve{

background:#28a745;
color:white;

}

.reject{

background:#dc3545;
color:white;

}

.pending{

color:gold;

}

</style>

</head>

<body>

<h1>🎁 Withdraw Requests</h1>

<table>

<thead>

<tr>

<th>ID</th>
<th>User</th>
<th>Type</th>
<th>Amount</th>
<th>Roblox</th>
<th>Discord</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="withdrawTable">

</tbody>

</table>

<script>

async function loadWithdraws(){

const res=await fetch(
"https://bladeball-spin-backend-kpjl.onrender.com/admin/withdraws"
);

const data=await res.json();

let html="";

data.data.forEach(w=>{

html+=`

<tr>

<td>${w.id}</td>

<td>${w.users.username}</td>

<td>${w.type}</td>

<td>${w.amount}</td>

<td>${w.roblox_username}</td>

<td>${w.discord_username}</td>

<td class="pending">${w.status}</td>

<td>

<button class="approve">
Approve
</button>

<button class="reject">
Reject
</button>

</td>

</tr>

`;

});

document.getElementById("withdrawTable").innerHTML=html;

}

loadWithdraws();

</script>

</body>

</html>
