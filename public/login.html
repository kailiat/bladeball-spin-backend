<!DOCTYPE html>
<html>

<head>

<title>Login</title>

</head>


<body style="background:#111;color:white;text-align:center;padding-top:80px;font-family:Arial">


<h1>🔐 Login</h1>


<input id="account" placeholder="Username"
style="padding:15px;">


<br><br>


<input id="password" 
type="password"
placeholder="Password"
style="padding:15px;">


<br><br>


<button onclick="login()">
Login
</button>



<script>


async function login(){


const res = await fetch(
"/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

credentials:"include",

body:JSON.stringify({

account:
document.getElementById("account").value,

password:
document.getElementById("password").value

})

});


const data = await res.json();



alert(data.message);



if(data.success){

location.href="/";

}


}


</script>


</body>

</html>
