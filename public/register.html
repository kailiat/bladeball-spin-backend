<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body{
    background: radial-gradient(circle at top,#1a1a2e,#0f0f1a);
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#1c1c24;
    padding:40px;
    border-radius:20px;
    width:320px;
    text-align:center;
    border:1px solid rgba(139,61,255,.3);
    box-shadow:0 0 25px rgba(139,61,255,.25);
}

h1{
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:12px;
    border:none;
    background:#2a2a35;
    color:white;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#8b3dff,#5f00ff);
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

a{
    color:#aaa;
    font-size:14px;
    display:block;
    margin-top:15px;
    text-decoration:none;
}

a:hover{
    color:white;
}
</style>

</head>

<body>

<div class="box">

<h1>📝 Register</h1>

<input id="account" placeholder="Username or Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Create Account</button>

<a href="/login.html">Already have account?</a>

</div>

<script>

async function register(){

const account = document.getElementById("account").value;
const password = document.getElementById("password").value;

const res = await fetch("/register",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ account, password })
});

const data = await res.json();

alert(data.message);

if(data.success){
location.href="/login.html";
}

}

</script>

</body>
</html>
