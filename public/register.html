<!DOCTYPE html>
<html>

<head>
<title>Register - Blade Ball Spin</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding-top:80px;
}

input{

display:block;
margin:15px auto;
padding:15px;
width:300px;
font-size:18px;

}

button{

padding:15px 50px;
font-size:20px;
border-radius:15px;
border:none;
background:#6d2dff;
color:white;
cursor:pointer;

}

</style>

</head>


<body>


<h1>📝 Register</h1>


<input id="account" placeholder="Username or Email">


<input id="password" 
type="password"
placeholder="Password">


<button onclick="register()">
Create Account
</button>


<p>
<a href="/" style="color:white">
Back
</a>
</p>



<script>


async function register(){


const account =
document.getElementById("account").value;


const password =
document.getElementById("password").value;



const res = await fetch(
"/register",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

account,
password

})

}

);



const data = await res.json();

console.log(data);

alert(JSON.stringify(data));



if(data.success){

location.href="/login.html";

}


}



</script>



</body>

</html>
