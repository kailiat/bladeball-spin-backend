<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
*{
    box-sizing:border-box;
}

body{
    background: radial-gradient(circle at top,#1a1a2e,#0f0f1a);
    color:white;
    font-family: 'Segoe UI', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

/* Glow background */
body::before{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#8b3dff;
    filter:blur(150px);
    opacity:.2;
    top:-100px;
    right:-100px;
}

/* Box */
.box{
    backdrop-filter: blur(20px);
    background: rgba(28,28,36,0.6);
    padding:40px;
    border-radius:20px;
    width:340px;
    text-align:center;
    border:1px solid rgba(139,61,255,.3);
    box-shadow:0 0 40px rgba(139,61,255,.25);
    animation: fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px)}
    to{opacity:1; transform:translateY(0)}
}

h1{
    margin-bottom:25px;
    font-weight:600;
}

/* Inputs */
.input-group{
    position:relative;
}

input{
    width:100%;
    padding:14px;
    margin:12px 0;
    border-radius:12px;
    border:1px solid transparent;
    background:#2a2a35;
    color:white;
    font-size:15px;
    transition:.3s;
}

input:focus{
    outline:none;
    border:1px solid #8b3dff;
    box-shadow:0 0 10px rgba(139,61,255,.5);
}

/* Button */
button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#8b3dff,#5f00ff);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(139,61,255,.3);
}

/* Link */
a{
    color:#aaa;
    font-size:14px;
    display:block;
    margin-top:18px;
    text-decoration:none;
    transition:.3s;
}

a:hover{
    color:white;
}
</style>

</head>

<body>

<div class="box">

<h1>📝 Register</h1>

<input id="account" placeholder="Username or Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Create Account</button>

<a href="/login.html">Already have account?</a>

</div>

<script>

async function register(){

const account = document.getElementById("account").value;
const password = document.getElementById("password").value;

const res = await fetch("/register",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ account, password })
});

const data = await res.json();

alert(data.message);

if(data.success){
location.href="/login.html";
}

}

</script>

</body>
</html>
