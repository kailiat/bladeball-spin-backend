<body>

<h1>🎁 Withdraw Requests</h1>
<div style="margin-top:20px;">
  <button onclick="showTab('withdraw')">💸 Withdraw</button>
  <button onclick="showTab('users')">👤 Users</button>
</div>
<input id="search" placeholder="Search user..." oninput="loadWithdraws()">
  <div class="stats">

  <div class="card">
    <h2 id="pendingCount">0</h2>
    <p>Pending</p>
  </div>

  <div class="card">
    <h2 id="completedCount">0</h2>
    <p>Completed</p>
  </div>

  <div class="card">
    <h2 id="rejectedCount">0</h2>
    <p>Rejected</p>
  </div>

  <!-- ✅ PHẢI NẰM TRONG -->
  <div class="card">
    <h2 id="onlineCount">0</h2>
    <p>Online</p>
  </div>


</div>

<div id="withdrawTab">

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>User</th>
      <th>Type</th>
      <th>Amount</th>
      <th>Roblox</th>
      <th>Discord</th>
      <th>Status</th>
      <th>Spin</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="withdrawTable"></tbody>
</table>
</div>
  <div id="usersTab" style="display:none; margin-top:20px;">

  <h1>👤 All Users</h1>

  <input id="searchUser" placeholder="Search user..." oninput="loadUsers()">

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Tokens</th>
        <th>Spin</th>
        <th>Created</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="usersTable"></tbody>
  </table>

</div>
</body>

<script>
  let currentUserId = null;
  function showTab(tab){

  document.getElementById("withdrawTab").style.display = "none";
  document.getElementById("usersTab").style.display = "none";

  document.getElementById(tab + "Tab").style.display = "block";

  if(tab === "users"){
    loadUsers();
  }

}
  async function loadUsers(){
  const res = await callAPI("/admin/users");

  if(!res.success) return;

  const keyword =
    document.getElementById("searchUser")?.value.toLowerCase() || "";

  const html = res.users
  .filter(u =>
    u.username.toLowerCase().includes(keyword)
  )
  .sort((a, b) => b.tokens - a.tokens) // 🔥 THÊM DÒNG NÀY
  .map(u => {

    return `
    <tr onclick="openUser(${u.id})" style="cursor:pointer;">
      <td>${u.id}</td>
      <td class="${u.banned ? 'banned' : ''}">
        ${u.username}
      </td>
      <td>${u.tokens}</td>
      <td>${u.spin_chances}</td>
      <td>${u.created_at}</td>
      <td>${u.banned ? '🚫 BANNED' : 'ACTIVE'}</td>
    </tr>
    `;

  }).join("");

  document.getElementById("usersTable").innerHTML = html;
}

const API = "https://bladeball-spin-backend-kpjl.onrender.com";

async function callAPI(endpoint, method = "GET", body = null) {
  const res = await fetch(API + endpoint, {
    method,
    credentials: "include",
    headers: {
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : null
  });

  const text = await res.text();

  try {
    return JSON.parse(text);
  } catch (e) {
    console.error("API lỗi:", text); // 🔥 xem lỗi thật ở đây
    throw new Error("API không trả JSON");
  }
}
function renderAction(w) {
  if (w.users.banned) return "🚫";

  if (w.status !== "pending") return "-";

  return `
    <button class="approve" onclick="handleAction(${w.id}, 'approve')">
      Approve
    </button>

    <button class="reject" onclick="handleAction(${w.id}, 'reject')">
      Reject
    </button>
  `;
}
async function loadWithdraws() {
  const data = await callAPI("/admin/withdraws");
  const keyword = document.getElementById("search")?.value.toLowerCase() || "";

  let stats = {
    pending: 0,
    completed: 0,
    rejected: 0
  };

  const filtered = data.data.filter(w =>
  w.users.username.toLowerCase().includes(keyword)
);

const html = filtered.map(w => {
  let spin = Number(w.users.spin_chances || 0);

let level = "";

if(spin >= 1000){
  level = "hack";
}else if(spin >= 500){
  level = "warn";
}

    stats[w.status]++;

    return `
<tr class="
${w.status === 'pending' ? 'row-pending' : ''}
${level === 'hack' ? 'row-hack' : ''}
${level === 'warn' ? 'row-warn' : ''}
">
      <td>${w.id}</td>
      <td onclick="openUser(${w.user_id})"
    class="${w.users.banned ? 'banned' : ''}"
    style="cursor:pointer; color:#8b3dff;">
  ${w.users.username}
</td>
      <td>${w.type}</td>
      <td>${w.amount}</td>
      <td>${w.roblox_username}</td>
      <td>${w.discord_username}</td>
      <td class="${w.status}">${w.status}</td>
<td>${w.users.spin_chances || 0}</td>
<td>
  ${renderAction(w)}
</td>
    </tr>
    `;
  }).join("");

  document.getElementById("withdrawTable").innerHTML = html;

  updateStats(stats);
};
  async function handleAction(id, action) {

  if (!confirm(`Bạn chắc muốn ${action}?`)) return;

  await callAPI(`/admin/${action}`, "POST", { id });

  loadWithdraws();
}
  function updateStats(stats) {
  document.getElementById("pendingCount").innerText = stats.pending;
  document.getElementById("completedCount").innerText = stats.completed;
  document.getElementById("rejectedCount").innerText = stats.rejected;
}
loadWithdraws();
setInterval(loadWithdraws, 10000);
  
  async function openUser(userId){
  try{

    const res = await callAPI(`/admin/user/${userId}`);

    if(!res.success){
      alert("Lỗi load user");
      return;
    }

    const u = res.user;
    const s = res.stats;

    document.getElementById("uName").innerText = u.username;
    currentUserId = userId;

document.getElementById("editTokens").value = u.tokens;
document.getElementById("editSpins").value = u.spin_chances;
    document.getElementById("uWon").innerText = s.total_won;
    document.getElementById("uWithdraw").innerText = s.total_withdraw;
    document.getElementById("uCreated").innerText = u.created_at;

    // 👇 lưu userId để dùng cho button
    

    document.getElementById("userPopup").style.display = "flex";

  }catch(err){
    console.error(err);
    alert("API lỗi");
  }
}

function closeUser(){
  document.getElementById("userPopup").style.display = "none";
}
  async function handleBan(userId){
  if(!confirm("Chắc chắn BAN user này?")) return;

  try{
    const res = await callAPI("/admin/ban", "POST", {
      user_id: userId
    });

    alert(res.message || "Banned!");
    closeUser();
    loadUsers();
    loadWithdraws();

  }catch(err){
    alert("Ban lỗi!");
  }
}


// 👇 VIẾT RIÊNG RA NGOÀI
async function loadDashboard(){
  const res = await callAPI("/admin/dashboard");

  if(!res.success) return;

  document.getElementById("onlineCount").innerText =
    res.stats.online;
}

// chạy ngay
loadDashboard();

// reload mỗi 10s
setInterval(loadDashboard, 10000);
  showTab("withdraw");

</script>
<div id="userPopup" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
">
  <div style="background:#111;padding:30px;border-radius:15px;width:400px">
    <h2 id="uName">User</h2>

    <p>💰 Tokens: 
  <input id="editTokens">
</p>

<p>🎯 Spins: 
  <input id="editSpins">
</p>
    <p>🏆 Won: <span id="uWon"></span></p>
    <p>💸 Withdraw: <span id="uWithdraw"></span></p>
    <p>📅 Created: <span id="uCreated"></span></p>

    <br>

    <button onclick="handleBan(currentUserId)" class="ban">🚫 Ban</button>
    <button onclick="saveUser()" style="background:#4ade80;">
  💾 Save
</button>

<button onclick="closeUser()">Close</button>
  </div>
</div>
</body>

</html>
