<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>BladeBall Admin</title>

<style>
  .row-warn{
  background:#3a2a1a !important;
  border-left:5px solid orange;
}

.row-hack{
  background:#3a1a1a !important;
  border-left:5px solid red;
}

body{

background:#111118;
color:white;
font-family:Arial;
padding:30px;

}

h1{

color:#8b3dff;

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

th{

background:#8b3dff;
padding:15px;

}

td{

background:#1d1d26;
padding:12px;
border-bottom:1px solid #333;
text-align:center;

}

button{

padding:8px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;

}

.approve{

background:#28a745;
color:white;

}

.reject{

background:#dc3545;
color:white;

}

.pending{

color:gold;

}
  .stats{

display:flex;
gap:20px;
margin-top:20px;
margin-bottom:20px;

}

.card{

background:#1b1b24;
padding:20px;
border-radius:15px;
width:180px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,.4);

}

.card h2{

font-size:40px;
margin:0;
color:#8b3dff;

}

.card p{

margin-top:10px;
color:#bbb;

}
  .completed{

color:#00ff7f;
font-weight:bold;

}

.rejected{

color:#ff4d4d;
font-weight:bold;

}
  .ban{
  background:#f59e0b;
  color:black;
}

.row-pending{
  background:#2a1f1f !important;
}
  .row-hack{
  background:#3a1a1a !important;
  border-left:5px solid red;
}
  input{
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  width:250px;
  background:#1d1d26;
  color:white;
}

tr:hover td{
  background:#2a2a3a;
  transition:0.2s;
}

button{
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
  opacity:0.9;
}

table{
  border-radius:15px;
  overflow:hidden;
}
  .banned{
  color:red !important;
  text-decoration: line-through;
  font-weight:bold;
}

</style>

</head>

<body>

<h1>🎁 Withdraw Requests</h1>

<input id="search" placeholder="Search user..." oninput="loadWithdraws()">

<div class="stats">
  <div class="card">
    <h2 id="pendingCount">0</h2>
    <p>Pending</p>
  </div>

  <div class="card">
    <h2 id="completedCount">0</h2>
    <p>Completed</p>
  </div>

  <div class="card">
    <h2 id="rejectedCount">0</h2>
    <p>Rejected</p>
  </div>

  <!-- ✅ PHẢI NẰM TRONG -->
  <div class="card">
    <h2 id="onlineCount">0</h2>
    <p>Online</p>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>User</th>
      <th>Type</th>
      <th>Amount</th>
      <th>Roblox</th>
      <th>Discord</th>
      <th>Status</th>
      <th>Spin</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="withdrawTable"></tbody>
</table>

</body>

<script>

const API = "https://bladeball-spin-backend-kpjl.onrender.com";

async function callAPI(endpoint, method = "GET", body = null) {
  const res = await fetch(API + endpoint, {
    method,
    credentials: "include",
    headers: {
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : null
  });

  const text = await res.text();

  try {
    return JSON.parse(text);
  } catch (e) {
    console.error("API lỗi:", text); // 🔥 xem lỗi thật ở đây
    throw new Error("API không trả JSON");
  }
}
function renderAction(w) {
  if (w.users.banned) return "🚫";

  if (w.status !== "pending") return "-";

  return `
    <button class="approve" onclick="handleAction(${w.id}, 'approve')">
      Approve
    </button>

    <button class="reject" onclick="handleAction(${w.id}, 'reject')">
      Reject
    </button>
  `;
}
async function loadWithdraws() {
  const data = await callAPI("/admin/withdraws");
  const keyword = document.getElementById("search")?.value.toLowerCase() || "";

  let stats = {
    pending: 0,
    completed: 0,
    rejected: 0
  };

  const filtered = data.data.filter(w =>
  w.users.username.toLowerCase().includes(keyword)
);

const html = filtered.map(w => {
  let spin = Number(w.users.spin_chances || 0);

let level = "";

if(spin >= 1000){
  level = "hack";
}else if(spin >= 500){
  level = "warn";
}

    stats[w.status]++;

    return `
<tr class="
${w.status === 'pending' ? 'row-pending' : ''}
${level === 'hack' ? 'row-hack' : ''}
${level === 'warn' ? 'row-warn' : ''}
">
      <td>${w.id}</td>
      <td onclick="openUser(${w.user_id})"
    class="${w.users.banned ? 'banned' : ''}"
    style="cursor:pointer; color:#8b3dff;">
  ${w.users.username}
</td>
      <td>${w.type}</td>
      <td>${w.amount}</td>
      <td>${w.roblox_username}</td>
      <td>${w.discord_username}</td>
      <td class="${w.status}">${w.status}</td>
<td>${w.users.spin || 0}</td>
<td>
  ${renderAction(w)}
</td>
    </tr>
    `;
  }).join("");

  document.getElementById("withdrawTable").innerHTML = html;

  updateStats(stats);
};
  async function handleAction(id, action) {

  if (!confirm(`Bạn chắc muốn ${action}?`)) return;

  await callAPI(`/admin/${action}`, "POST", { id });

  loadWithdraws();
}
  function updateStats(stats) {
  document.getElementById("pendingCount").innerText = stats.pending;
  document.getElementById("completedCount").innerText = stats.completed;
  document.getElementById("rejectedCount").innerText = stats.rejected;
}
loadWithdraws();
setInterval(loadWithdraws, 10000);
  
  async function openUser(userId){

  const action = confirm("👉 OK = Xem profile\n❌ Cancel = BAN");

  if(!action){
    if(confirm("Bạn chắc chắn BAN user này?")){
      handleBan(userId);
    }
    return;
  }

  const res = await callAPI(`/admin/user/${userId}`);

  if(!res.success){
    alert("Lỗi load user");
    return;
  }

  const u = res.user;
  const s = res.stats;

  document.getElementById("uName").innerText = u.username;
  document.getElementById("uTokens").innerText = u.tokens;
  document.getElementById("uSpins").innerText = s.total_spins;
  document.getElementById("uWon").innerText = s.total_won;
  document.getElementById("uWithdraw").innerText = s.total_withdraw;
  document.getElementById("uCreated").innerText = u.created_at;

  document.getElementById("userPopup").style.display = "flex";
}
    function closeUser(){
  document.getElementById("userPopup").style.display = "none";
}
  async function handleBan(userId){
  try{
    const res = await callAPI("/admin/ban", "POST", {
      user_id: userId
    });

    alert(res.message || "Banned!");

    loadWithdraws();

  }catch(err){
    alert("Ban lỗi!");
    console.error(err);
  }
} // ✅ ĐÓNG Ở ĐÂY


// 👇 VIẾT RIÊNG RA NGOÀI
async function loadDashboard(){
  const res = await callAPI("/admin/dashboard");

  if(!res.success) return;

  document.getElementById("onlineCount").innerText =
    res.stats.online;
}

// chạy ngay
loadDashboard();

// reload mỗi 10s
setInterval(loadDashboard, 10000);
  function openUser(user){
  document.getElementById("userPopup").style.display = "block";

  document.getElementById("uTokens").innerText = user.tokens || 0;
  document.getElementById("uSpins").innerText = user.spin_chances || 0;
  document.getElementById("uWon").innerText = user.total_win || 0;
  document.getElementById("uWithdraw").innerText = user.total_withdraw || 0;
  document.getElementById("uCreated").innerText =
    user.created_at ? new Date(user.created_at).toLocaleString() : "N/A";
}

function closeUser(){
  document.getElementById("userPopup").style.display = "none";
}
  
</script>
<div id="userPopup" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
">
  <div style="background:#111;padding:30px;border-radius:15px;width:400px">
    <h2 id="uName">User</h2>

    <p>💰 Tokens: <span id="uTokens"></span></p>
    <p>🎯 Spins: <span id="uSpins"></span></p>
    <p>🏆 Won: <span id="uWon"></span></p>
    <p>💸 Withdraw: <span id="uWithdraw"></span></p>
    <p>📅 Created: <span id="uCreated"></span></p>

    <br>

    <button onclick="closeUser()">Close</button>
  </div>
</div>
</body>

</html>
