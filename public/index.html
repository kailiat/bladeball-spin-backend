<!DOCTYPE html>
<html>
<head>
    <title>Blade Ball Spin</title>

    <style>
        body {
            background:#111;
            color:white;
            font-family:Arial;
            text-align:center;
            padding-top:100px;
        }

        h1 {
            font-size:50px;
        }

        button {
            font-size:30px;
            padding:20px 60px;
            border-radius:20px;
            cursor:pointer;
            background:#7c3cff;
            color:white;
            border:none;
        }

        button:hover {
            transform:scale(1.05);
        }
    </style>

</head>

<body>

<h1>🎡 Blade Ball Spin</h1>

<button onclick="spin()">
    SPIN
</button>


<script>

async function spin(){

    const res = await fetch(
        "https://bladeball-spin-backend.onrender.com/spin",
        {
            method:"POST",
            credentials:"include"
        }
    );

    const data = await res.json();

    console.log(data);

    alert(JSON.stringify(data));

}

</script>

</body>
</html>
