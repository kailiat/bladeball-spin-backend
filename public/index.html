<!DOCTYPE html>
<html>

<head>

<title>Blade Ball Spin</title>

<style>

body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:50px;
}


h1 {
    font-size:45px;
}


.wheel-container {
    position:relative;
    margin:40px auto;
    width:320px;
    height:320px;
}


.wheel{

    position:relative;

    width:320px;
    height:320px;

    border-radius:50%;

    background-image:

    repeating-conic-gradient(

        rgba(255,255,255,.9) 0deg 1deg,
        transparent 1deg 30deg

    ),

    conic-gradient(

        #6d2dff 0deg 30deg,
        #2d9cff 30deg 60deg,
        #444444 60deg 90deg,
        #6d2dff 90deg 120deg,
        #2d9cff 120deg 150deg,
        #444444 150deg 180deg,
        #6d2dff 180deg 210deg,
        #2d9cff 210deg 240deg,
        #444444 240deg 270deg,
        #6d2dff 270deg 300deg,
        #2d9cff 300deg 330deg,
        #444444 330deg 360deg

    );

    border:8px solid white;

    transition:transform 5s cubic-bezier(.17,.67,.25,1);

}



.arrow {

    position:absolute;

    top:-20px;

    left:145px;

    font-size:40px;

}


button{

    margin-top:20px;

    font-size:30px;

    padding:20px 70px;

    border:none;

    border-radius:20px;

    background:linear-gradient(
        90deg,
        #8b3dff,
        #6d2dff
    );

    color:white;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 0 20px rgba(124,60,255,.45);

}


button:hover{

    transform:scale(1.08);

    box-shadow:
        0 0 35px rgba(124,60,255,.8);

}



#result{
    margin-top:30px;
    min-height:90px;
    font-size:35px;
    font-weight:bold;
}

.logo{
    font-size:60px;
    margin-bottom:10px;
    animation: float 2s ease-in-out infinite;
}

.subtitle{
    color:#aaa;
    font-size:18px;
    margin-bottom:35px;
}
.popup{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.75);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:999;

}

.popup-box{

    background:#1d1d1d;

    border-radius:20px;

    padding:40px;

    width:420px;

    box-shadow:0 0 40px rgba(124,60,255,.8);

    animation:popupShow .35s;

}

.popup-box h2{

    font-size:40px;

    margin-bottom:15px;

}

.popup-box p{

    font-size:35px;

    margin-bottom:30px;

    color:#ffd54f;

}

@keyframes popupShow{

    from{
        transform:scale(.6);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}
@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }

}
    #wheelLabels{
    position:absolute;
    top:0;
    left:0;
    width:320px;
    height:320px;
    pointer-events:none;
}

.wheel-label{
    position:absolute;
    width:60px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 5px black;
    transform: translate(-50%, -50%);
}
    .menu{

    margin-top:35px;

}

.menu button{

    margin:8px;

    padding:14px 35px;

    font-size:18px;

}
</style>

</head>


<body>


<div class="logo">
    🎡
</div>

<h1>Blade Ball Spin</h1>

<p class="subtitle">
    Spin every day to win Tokens!
</p>
<div id="userBox">

    <button onclick="loginGoogle()">
        🔐 Login with Google
    </button>

</div>


<div class="wheel-container">

<div class="arrow">
▼
</div>


<div id="wheel" class="wheel">
    <div id="wheelLabels"></div>
</div>
</div>




<button onclick="spin()">
SPIN
</button>
<div class="menu">

    <button onclick="showWithdraw()">
        🎁 Withdraw
    </button>

    <button onclick="showHistory()">
        📜 History
    </button>

    <button onclick="showProfile()">
        👤 Profile
    </button>

</div>

<div id="popup" class="popup">

    <div class="popup-box">

        <h2 id="popupTitle">
            Congratulations!
        </h2>

        <p id="popupReward">
            500 Tokens
        </p>

        <button onclick="closePopup()">
            Collect
        </button>

    </div>

</div>

<div id="withdrawPopup" class="popup">

    <div class="popup-box">

        <h2>🎁 Withdraw</h2>

        <p>
            Your Balance
            <br>
            <span id="balanceValue">0</span> ⭐
        </p>

        <p>
            Minimum Withdrawal
            <br>
            <b>3 Tokens</b>
        </p>

        <input id="robloxName" placeholder="Roblox Username">

        <br><br>

        <input id="discordName" placeholder="Discord Username">

        <br><br>

        <button id="withdrawBtn" onclick="submitWithdraw()">
            Withdraw
        </button>

        <br><br>

        <button onclick="closeWithdraw()">
            Cancel
        </button>

    </div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "AIzaSyAwHP1TdLpeUUWn_wyU_e27XBJgUunJ2NU",

    authDomain: "bladeballspin.firebaseapp.com",

    projectId: "bladeballspin",

    storageBucket: "bladeballspin.firebasestorage.app",

    messagingSenderId: "383503271988",

    appId: "1:383503271988:web:266ea99181ae0aec3ca261"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

window.db = db;
window.doc = doc;
window.getDoc = getDoc;
window.setDoc = setDoc;
window.onAuthStateChanged = onAuthStateChanged;
const provider = new GoogleAuthProvider();

window.auth = auth;
window.provider = provider;
window.signInWithPopup = signInWithPopup;
window.signOut = signOut;
window.onAuthStateChanged(window.auth, async (user)=>{

    if(user){

        const userRef = window.doc(
            window.db,
            "users",
            user.uid
        );


        const userSnap = await window.getDoc(userRef);


if(!userSnap.exists()){

    await window.setDoc(
        userRef,
        {
            name:user.displayName,
            email:user.email,
            tokens:0,
            spins:0
        }
    );


    document.getElementById("balanceValue").innerText = 0;


}else{


    const userData = userSnap.data();


    document.getElementById("balanceValue").innerText =
        userData.tokens;

}


        document.getElementById("userBox").innerHTML = `

            <h3>👤 ${user.displayName}</h3>

            <p>${user.email}</p>

            <button onclick="logoutGoogle()">
                Logout
            </button>

        `;


    }else{


        document.getElementById("userBox").innerHTML = `

            <button onclick="loginGoogle()">
                🔐 Login with Google
            </button>

        `;


    }

});
</script>
<script>

let spinning = false;
let currentRotation = 0;

    const rewards = [
    "500",
    "100",
    "Nothing",
    "500",
    "100",
    "Nothing",
    "500",
    "100",
    "Nothing",
    "500",
    "100",
    "Nothing"
];

const wheelLabels = document.getElementById("wheelLabels");

rewards.forEach((text, i) => {

    const label = document.createElement("div");

    label.className = "wheel-label";

    label.innerHTML = text;

    const angle = i * 30 - 75;

    const radius = 125;

    const x = 160 + radius * Math.cos(angle * Math.PI / 180);
    const y = 160 + radius * Math.sin(angle * Math.PI / 180);

    label.style.position = "absolute";
    label.style.left = x + "px";
label.style.top = y + "px";

    wheelLabels.appendChild(label);

});

async function spin() {

    if (spinning) return;

    spinning = true;

    const wheel = document.getElementById("wheel");

    // Quay vòng
    currentRotation += 1800 + Math.floor(Math.random() * 360);

    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(async () => {

        try {

            const res = await fetch(
                "https://bladeball-spin-backend.onrender.com/spin",
                {
                    method: "POST",
                    credentials: "include"
                }
            );

            const data = await res.json();

            console.log(data);

            if (data.success) {

    // Cập nhật Token ngay
    document.getElementById("balanceValue").innerText = data.balance;

    document.getElementById("popupTitle").innerHTML =
        "Congratulations!";

    document.getElementById("popupReward").innerHTML =
        `${data.reward.amount} Tokens`;

    document.getElementById("popup").style.display = "flex";

}
            else {

                alert(data.message || data.error);

            }

        } catch (err) {

            alert("Server Error");

            console.error(err);

        }

        spinning = false;

    }, 5000);

}

function closePopup(){

document.getElementById("popup").style.display="none";

}
async function loginGoogle(){

    try{

        const result = await window.signInWithPopup(
            window.auth,
            window.provider
        );

        const user = result.user;


// lưu user vào Firestore

const userRef = window.doc(
    window.db,
    "users",
    user.uid
);


const userSnap = await window.getDoc(userRef);


if(!userSnap.exists()){

    await window.setDoc(
        userRef,
        {
            name:user.displayName,
            email:user.email,
            tokens:0,
            spins:0
        }
    );

    document.getElementById("balanceValue").innerText = 0;


}else{

    const userData = userSnap.data();

    document.getElementById("balanceValue").innerText =
        userData.tokens || 0;

}


document.getElementById("userBox").innerHTML = `
    <h3>👤 ${user.displayName}</h3>
    <p>${user.email}</p>

    <button onclick="logoutGoogle()">
        Logout
    </button>
`;

    }catch(err){

    if(err.code === "auth/cancelled-popup-request"){
        return;
    }

    alert("Login failed. Please try again.");

}

}

async function logoutGoogle(){

    try{

        await window.signOut(window.auth);

        document.getElementById("userBox").innerHTML = `
            <button onclick="loginGoogle()">
                🔐 Login with Google
            </button>
        `;

    }catch(err){

        alert("Logout failed.");

    }

}
    
function showWithdraw(){

    document.getElementById("withdrawPopup").style.display = "flex";

}
function closeWithdraw(){

    document.getElementById("withdrawPopup").style.display = "none";

}
function submitWithdraw(){

    const balance =
        parseInt(document.getElementById("balanceValue").innerText);

    if(balance < 3){
        alert("You need at least 3 Tokens to withdraw.");
        return;
    }

    alert("Withdraw request sent!");

    closeWithdraw();

}
function showHistory(){

    alert("History page coming soon!");

}

function showProfile(){

    alert("Profile page coming soon!");

}
</script>


</body>

</html>
