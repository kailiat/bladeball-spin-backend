<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Mission Complete</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{

margin:0;
padding:0;

background:
radial-gradient(circle at top,#3b1768 0%,#17171d 35%,#0b0b0d 100%);

font-family:'Poppins',sans-serif;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

color:white;

text-align:center;

}

.box{

width:520px;

background:#1d1d24;

border-radius:25px;

padding:45px;

border:1px solid rgba(139,61,255,.45);

box-shadow:
0 0 40px rgba(139,61,255,.45);

}

.logo{

font-size:70px;

margin-bottom:10px;

animation:float 2s ease-in-out infinite;

}

.title{

font-family:'Orbitron';

font-size:58px;

margin:0;

text-shadow:
0 0 20px #8b3dff;

}

.sub{

font-family:'Orbitron';

color:#b88cff;

letter-spacing:6px;

margin-bottom:30px;

}

.reward{

font-size:40px;

font-weight:bold;

color:#ffd54f;

margin:30px 0;

}

button{

padding:18px 70px;

font-size:26px;

font-weight:bold;

border:none;

border-radius:18px;

cursor:pointer;

background:
linear-gradient(
90deg,
#8b3dff,
#6d2dff
);

color:white;

transition:.25s;

box-shadow:
0 0 25px rgba(139,61,255,.5);

}

button:hover{

transform:scale(1.05);

}

#status{

margin-top:25px;

font-size:24px;

font-weight:bold;

color:#6dff91;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

</style>

</head>

<body>

<div class="box">

<div class="logo">
⚔️
</div>

<h1 class="title">
BLADE BALL
</h1>

<div class="sub">
MISSION COMPLETE
</div>

<h2>
🎉 Congratulations!
</h2>

<p>
You completed the mission.
</p>

<div class="reward">
⭐ +1 Spin
</div>

<button id="claimBtn">
CLAIM REWARD
</button>

<div id="status"></div>

</div>

<script>


const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const btn = document.getElementById("claimBtn");
const status = document.getElementById("status");

btn.onclick = async () => {

    btn.disabled = true;
    btn.innerText = "PLEASE WAIT...";

    try{

        const res = await fetch(
            "https://bladeball-spin-backend-kpjl.onrender.com/mission/claim",
            {
                method:"POST",
                credentials:"include",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    token
                })
            }
        );

        const data = await res.json();

        if(!data.success){

            status.style.color = "#ff6b6b";
            status.innerText = data.message || data.error;

            btn.disabled = false;
            btn.innerText = "CLAIM REWARD";

            return;

        }

        status.style.color = "#6dff91";
        status.innerText = "✅ +1 Spin Added";

        btn.innerText = "CLAIMED";

        setTimeout(()=>{

            window.location.href="/";

        },2000);

    }
    catch(err){

        status.style.color="#ff6b6b";
        status.innerText="Server Error";

        btn.disabled=false;
        btn.innerText="CLAIM REWARD";

    }

}
</script>



</body>

</html>
